[project]
name = "agent0-ipo-dispatcher"
version = "0.1.0"
description = "bub plugin: watch the tape for new C2 events and trigger a turn for subscribed skills."
requires-python = ">=3.12,<4.0"
dependencies = ["bub"]

[project.entry-points.bub]
agent0_ipo_dispatcher = "agent0_ipo_dispatcher.plugin:Plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent0_ipo_dispatcher"]
